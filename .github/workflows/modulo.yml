name: modulo

# The Claude Code module on each system, against the published Release: downloads the binary and uses it.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  modulo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/probar_modulo.mjs
